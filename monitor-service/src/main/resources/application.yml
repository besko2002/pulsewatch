server:
  port: 8101
spring:
  datasource:
    url: ${MONITOR_DB_URL:jdbc:postgresql://localhost:5436/monitor_db}
    username: ${MONITOR_DB_USER:monitor_user}
    password: ${MONITOR_DB_PASSWORD:monitor_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/pulsewatch/protocol/openid-connect/certs}
springdoc:
  api-docs:
    path: /v3/api-docs
