server:
  port: 8105
spring:
  datasource:
    url: ${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5436/telemetry_db}
    username: ${TELEMETRY_DB_USER:telemetry_user}
    password: ${TELEMETRY_DB_PASSWORD:telemetry_pass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.besko2002.pulsewatch.events
        spring.json.value.default.type: io.github.besko2002.pulsewatch.events.CheckResult
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/pulsewatch/protocol/openid-connect/certs}
